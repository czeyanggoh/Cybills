# Install to /etc/nginx/sites-available/cybills and symlink into
# sites-enabled, then `certbot --nginx -d cybills.cy-bm.sg` to add TLS.
server {
    listen 80;
    listen [::]:80;
    server_name cybills.cy-bm.sg;

    root /opt/cybills/dist;
    index index.html;

    client_max_body_size 10m;

    # Proxy /api/* to the Express backend on localhost:3004
    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # SPA: serve static, fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
